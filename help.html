/* Topics */

.card {

}

/* Dark Mode */
.dark {
  background: #111;

.dark .navbar,
.dark .card,
.dark .suggestions {

  color: white;
}

/* Responsive */

a {

}

  padding: 60px 20px;

}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

  margin-top: 30px;
}

/* 🔥 Card Design */
.card {
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 25px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.35s ease;
  border: 1px solid rgba(0,0,0,0.05);
}

/* Glow gradient layer */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, #6366f1, #06b6d4, #10b981);
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: 0;
}

/* Content above glow */
.card * {
  position: relative;
  z-index: 1;
}

/* Icon */
.card i {
  font-size: 28px;
  margin-bottom: 12px;
  color: #4f46e5;
  transition: transform 0.35s ease, color 0.35s ease;
}

/* Hover Effects 😈 */
.card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
}

/* Gradient glow appears */
.card:hover::before {
  opacity: 0.08;
}

/* Icon animation */
.card:hover i {
  transform: translateY(-5px) scale(1.2) rotate(5deg);
  color: #06b6d4;
}

/* Text */
.card h3 {
  font-size: 16px;
  font-weight: 600;

<script>
// Search Suggestions
const data = [
  "Send money",
  "Receive money",
  "Account verification",
  "Reset password",
  "Card issues",
  "Business account"
];

const input = document.getElementById("search");
const suggestions = document.getElementById("suggestions");

input.addEventListener("input", () => {
  let value = input.value.toLowerCase();
  suggestions.innerHTML = "";

  if (value === "") {
    suggestions.style.display = "none";
    return;
  }

  let filtered = data.filter(item => item.toLowerCase().includes(value));

  filtered.forEach(item => {
    let div = document.createElement("div");
    div.textContent = item;
    div.onclick = () => {
      input.value = item;
      suggestions.style.display = "none";
    };
    suggestions.appendChild(div);
  });

  suggestions.style.display = "block";
});


// Dark Mode Toggle
function toggleDark() {
  document.body.classList.toggle("dark");
}
</script>


<script>
const cards = document.querySelectorAll(".card");

cards.forEach((card, i) => {
  card.style.opacity = "0";
  card.style.transform = "translateY(30px)";

  setTimeout(() => {
    card.style.transition = "all 0.6s ease";
    card.style.opacity = "1";
    card.style.transform = "translateY(0)";
  }, i * 100);
});
</script>
<!-- 🔥 ZENVORA FINTECH CHATBOT START -->

<!-- Button -->
<div class="chat-btn" onclick="toggleChat()">💬</div>

<!-- Chatbox -->
<div class="chatbox" id="chatbox">
  <div class="header">Zenvora Support 💸</div>

  <div id="messages" class="messages"></div>

  <!-- Quick buttons -->
  <div class="quick">
    <button onclick="quickMsg('fees')">💰 Fees</button>
    <button onclick="quickMsg('exchange rate')">💱 Rate</button>
    <button onclick="quickMsg('transfer time')">⏱ Time</button>
    <button onclick="quickMsg('verify account')">🪪 KYC</button>
  </div>

  <div id="typing" class="typing">🤖 typing...</div>

  <div class="input-box">
    <input id="msg" placeholder="Ask about transfers...">
    <button onclick="send()">Send</button>
  </div>
</div>

<style>
.chat-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#22c55e;
  color:white;
  padding:15px;

}

.chatbox{

  bottom:80px;

  flex-direction:column;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  transform:translateY(40px);
  opacity:0;
  transition:0.3s;

.chatbox.active{
  display:flex;
  transform:translateY(0);
  opacity:1;

.header{

  color:white;
  align-self:flex-end;
}

.bot{
  background:#eee;
  align-self:flex-start;
}

.typing{
  font-size:12px;
  padding:5px 10px;
  color:gray;
  display:none;
}

.quick{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  padding:5px;

.quick button{
  border:none;
  background:#eee;

  border-radius:15px;
  cursor:pointer;
}

.input-box{
  display:flex;
  border-top:1px solid #ddd;
}

  flex:1;
  padding:10px;
  border:none;
  outline:none;

  background:#22c55e;
  color:white;
  border:none;
  padding:10px;

</style>

<script>
function toggleChat(){
  document.getElementById("chatbox").classList.toggle("active");
}

function addMessage(text, type){
  let chat = document.getElementById("messages");

  let div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(){
  document.getElementById("typing").style.display="block";
}
function hideTyping(){
  document.getElementById("typing").style.display="none";
}

function send(){
  let input = document.getElementById("msg");
  let text = input.value.trim();

  if(!text) return;

  addMessage(text, "user");
  input.value="";

  showTyping();

  setTimeout(()=>{
    hideTyping();
    let reply = smartAI(text);
    addMessage(reply, "bot");
  },1000);
}

function quickMsg(text){
  document.getElementById("msg").value = text;
  send();
}

// 💸 FINTECH AI LOGIC
function smartAI(input){
  input = input.toLowerCase();

  if(input.match(/hi|hello|hey/))
    return "👋 Welcome to Zenvora! I help with transfers.";

  if(input.includes("transfer"))
    return "💸 Enter amount → Add recipient → Pay securely.";

  if(input.includes("fee"))
    return "💰 Transparent low fees shown before payment.";

  if(input.includes("rate"))
    return "💱 Real-time exchange rates with no hidden markup.";

  if(input.includes("time"))
    return "⏱ Transfers take minutes to 24 hours.";

  if(input.includes("verify") || input.includes("kyc"))
    return "🪪 Upload ID to verify your account.";

  if(input.includes("failed"))
    return "❌ Try another payment method or check details.";

  if(input.includes("refund"))
    return "🔁 Refunds are automatic if transfer fails.";

  return "🤖 Ask me about fees, rates, or transfers.";
}
</script>

<!-- 🔥 ZENVORA FINTECH CHATBOT END -->
