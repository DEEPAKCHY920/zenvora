<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zenvora Login</title>

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
   <link rel="icon" href="favicon2.png" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon2.png" />
</head>
<body>

<div class="container">

  <div class="login-box">

    <h2>Welcome back</h2>
    <p class="signup-text">New here zenvora ? <a href="#">Sign up</a></p>

    <form>
      <label>Email address</label>
      <input type="email" placeholder="Enter email" required>

      <label>Password</label>

      <div class="password-box">
        <input type="password" id="password" placeholder="Enter password" required>
        <i class="fa-solid fa-eye" id="togglePassword"></i>
      </div>

      <button type="submit">Log in</button>
    </form>

    <a href="#" class="forgot">Trouble logging in?</a>

    <p class="or">Or continue with</p>

    <div class="social-login">
      <button><i class="fab fa-google"></i></button>
      <button><i class="fab fa-facebook-f"></i></button>
      <button><i class="fab fa-apple"></i></button>
    </div>

    <button class="passkey">
      <i class="fa-solid fa-key"></i> Log in with a passkey
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
