<body>

<div class="container">
  <div class="form-box">
<h1><a href="index.html" style="color:white; text-align: center; margin-left: 81px;">zenvora</a></h1>
    <h2>Create Account</h2>

    <form>
      <div class="input-box">
        <i class="fa fa-user"></i>
        <input type="text" placeholder="Full Name" required>
      </div>

      <div class="input-box">
        <i class="fa fa-envelope"></i>
        <input type="email" placeholder="Email" required>
      </div>

      <div class="input-box password-box">
        <i class="fa fa-lock"></i>
        <input type="password" id="password" placeholder="Password" required>
        <i class="fa fa-eye toggle" onclick="togglePassword()"></i>
      </div>

      <div class="input-box password-box">
        <i class="fa fa-lock"></i>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <i class="fa fa-eye toggle" onclick="toggleConfirmPassword()"></i>
      </div>

      <button type="submit" class="btn">Sign Up</button>

      <p class="or">or sign up with</p>

      <div class="social-icons">
        <i class="fab fa-google"></i>
        <i class="fab fa-facebook-f"></i>
        <i class="fab fa-apple"></i>
      </div>

      <p class="switch">
        Already have an account? <a href="login.html">Login</a>
      </p>

    </form>

  </div>
</div>
